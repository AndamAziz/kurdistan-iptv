# KURDISTAN IPTV for VIDAA - ONLY if VIDAA asks for a hosted URL instead of a .zip.
#
# A separate site of its own: static files only (no program runs), in its own
# folder, on its own sub-domain. It does not touch any other site on the VPS.
#
#   1. sudo mkdir -p /var/www/kurdistan-vidaa
#   2. copy everything in vidaa/build/ into /var/www/kurdistan-vidaa/
#   3. sudo cp kurdistan-vidaa.nginx.conf /etc/nginx/sites-available/kurdistan-vidaa
#      sudo ln -s /etc/nginx/sites-available/kurdistan-vidaa /etc/nginx/sites-enabled/
#   4. sudo nginx -t      (must say "ok" - if not, remove the link from step 3 and stop)
#      sudo systemctl reload nginx
#   5. HTTPS: sudo certbot --nginx -d tv.andam.uk
#
# Change tv.andam.uk below if you use another sub-domain (its DNS A record must
# point at the VPS first).
server {
    listen 80;
    listen [::]:80;
    server_name tv.andam.uk;

    root /var/www/kurdistan-vidaa;
    index index.html;

    access_log /var/log/nginx/kurdistan-vidaa.access.log;
    error_log  /var/log/nginx/kurdistan-vidaa.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
    # the page itself is always asked again, so an update shows at once
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|png|mp3)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
