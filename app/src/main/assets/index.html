<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080B10">
<title>KURDISTAN IPTV</title>
<style>
:root{
  --bg:#080B10; --bg2:#0B0F16; --surface:#121924; --surface2:#19222F;
  --line:#202A38; --text:#EAF0F6; --muted:#8B97A6; --muted2:#5E6977;
  --accent:#E63E46; --accent2:#FF6A5E; --live:#2FD46E;
  --r-lg:24px; --r-md:16px; --r-sm:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:340px;z-index:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,rgba(230,62,70,.16),transparent 62%);
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) 14px 10px;
  background:rgba(8,11,16,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.top{display:flex;align-items:center;gap:10px}
.iconbtn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-size:19px;cursor:pointer;transition:.18s;
}
.iconbtn:active{transform:scale(.92);background:var(--surface2)}
.iconbtn svg{display:block}
.brand{flex:1;text-align:center;line-height:1;user-select:none}
.brand .w1{font-size:20px;font-weight:800;letter-spacing:4px;color:#fff}
.brand .w2{font-size:20px;font-weight:800;letter-spacing:4px;
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:5px;font-size:9px;letter-spacing:3.5px;color:var(--muted2);font-weight:700}

.ann{
  margin-top:11px;display:flex;align-items:center;gap:9px;
  background:linear-gradient(90deg,rgba(230,62,70,.14),rgba(230,62,70,.04));
  border:1px solid rgba(230,62,70,.28);border-radius:var(--r-sm);
  padding:8px 11px;font-size:12px;overflow:hidden;
}
.ann i{font-style:normal;flex:none;display:flex}
.ann-wrap{flex:1;overflow:hidden;white-space:nowrap}
.ann-wrap span{display:inline-block;white-space:nowrap;animation:marq 26s linear infinite;animation-delay:-13s;color:#F4C9C9;font-weight:600}
@keyframes marq{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

.searchbox{display:none;margin-top:10px;position:relative}
.searchbox.on{display:block}
.searchbox input{
  width:100%;padding:13px 42px 13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font-size:15px;outline:none;
}
.searchbox input:focus{border-color:rgba(230,62,70,.55)}
.searchbox b{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--muted2);display:flex}

.chips{display:flex;gap:8px;overflow-x:auto;padding-top:11px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;
  cursor:pointer;transition:.18s;flex:none;
}
.chip:active{transform:scale(.94)}
.chip.on{
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;box-shadow:0 5px 16px rgba(230,62,70,.35);
}

/* ---------- main ---------- */
main{position:relative;z-index:1;padding:6px 14px calc(44px + var(--safe-b))}
section{margin-top:22px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.shead h2{margin:0;font-size:17px;font-weight:800;letter-spacing:.2px}
.shead .bar{width:4px;height:19px;border-radius:99px;background:linear-gradient(var(--accent),var(--accent2));flex:none}
.shead .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--muted2);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(6,1fr)}}

.card{cursor:pointer;transition:transform .16s}
.card:active{transform:scale(.94)}
.tile{
  position:relative;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 10px 24px rgba(0,0,0,.45);
}
.tile::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 46%);
}
.mono{
  position:absolute;inset:0;display:grid;place-items:center;
  font-weight:900;font-size:clamp(15px,5.4vw,25px);letter-spacing:.5px;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.45);
}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:17%;background:var(--surface)}
.dot{
  position:absolute;top:9px;inset-inline-start:9px;width:7px;height:7px;border-radius:99px;
  background:var(--live);box-shadow:0 0 0 3px rgba(47,212,110,.18);animation:pulse 2.1s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.name{
  font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;
  padding:9px 2px 0;line-height:1.35;min-height:41px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card:active .name{color:var(--text)}

.empty{text-align:center;padding:70px 20px;color:var(--muted2)}
.empty div:first-child{font-size:42px;margin-bottom:12px;opacity:.5}
.empty p{margin:0;font-size:14px;font-weight:600}

/* ---------- activation ---------- */
#gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:24px}
#gate.hide{display:none}
.gbox{width:min(400px,100%);text-align:center}
.glogo{
  width:84px;height:84px;margin:0 auto 22px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 18px 44px rgba(230,62,70,.4);font-size:36px;
}
.gbox h1{margin:0 0 7px;font-size:22px;font-weight:800;letter-spacing:2px}
.gbox h1 em{font-style:normal;color:var(--accent2)}
.gbox p{margin:0 0 26px;color:var(--muted);font-size:13.5px}
.pins{display:flex;gap:11px;justify-content:center;direction:ltr}
.pin{
  width:56px;height:64px;border-radius:var(--r-md);background:var(--surface);
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:26px;font-weight:800;transition:.2s;
}
.pin.fill{border-color:var(--accent);background:var(--surface2)}
.pin.cur{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(230,62,70,.14)}
#pininput{position:absolute;opacity:0;pointer-events:none;height:0;width:0}
.gmsg{height:26px;padding-top:15px;color:#FF7B7B;font-size:13px;font-weight:700}
.gbtn{
  width:100%;margin-top:6px;padding:15px;border:0;border-radius:var(--r-md);
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:15px;cursor:pointer;
  box-shadow:0 12px 28px rgba(230,62,70,.32);
}
.gbtn:active{transform:scale(.97)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.on{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
#sheet .pn{
  position:absolute;inset-inline:0;bottom:0;background:var(--bg2);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(24px + var(--safe-b));animation:up .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#sheet .grab{width:42px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 16px}
#sheet h3{margin:0 0 14px;font-size:15px;font-weight:800}
.lang{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;font-weight:700;font-size:14px;
}
.lang.on{border-color:var(--accent);background:var(--surface2)}
.lang .tick{margin-inline-start:auto;color:var(--accent2);font-size:17px;opacity:0}
.lang.on .tick{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <div class="glogo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="12.5" rx="2.6"/><path d="M8 3.5l4 4.2 4-4.2"/></svg></div>
    <h1>KURDISTAN <em>IPTV</em></h1>
    <p id="gate-sub"></p>
    <div class="pins" id="pins"></div>
    <input id="pininput" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <div class="gmsg" id="gmsg"></div>
    <button class="gbtn" id="gbtn" onclick="submitPin()"></button>
  </div>
</div>

<header>
  <div class="top">
    <button class="iconbtn" onclick="toggleSearch()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></button>
    <div class="brand">
      <span class="w1">KURDISTAN</span> <span class="w2">IPTV</span>
      <small id="tagline"></small>
    </div>
    <button class="iconbtn" onclick="openSheet()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/></svg></button>
  </div>

  <div class="ann">
    <i><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E86A6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 001 1h3l5 4V5L7 9H4a1 1 0 00-1 1z"/><path d="M16.5 8.5a5 5 0 010 7"/><path d="M19.5 5.5a9 9 0 010 13"/></svg></i>
    <div class="ann-wrap"><span id="annText"></span></div>
  </div>

  <div class="searchbox" id="sbox">
    <input id="search" oninput="render()" autocomplete="off">
    <b><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></b>
  </div>

  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<div id="sheet">
  <div class="bd" onclick="closeSheet()"></div>
  <div class="pn">
    <div class="grab"></div>
    <h3 id="sheetTitle"></h3>
    <div id="langs"></div>
  </div>
</div>

<script src="channels.js"></script>
<script>
/* ============ CONFIG ============ */
var LOGO_BASE = "https://andam.uk/logos/";   /* put <slug>.png files here */
var USE_REMOTE_LOGOS = true;                 /* set false to use monograms only */

var CH = window.CHANNELS || [];

/* ============ i18n ============ */
var T = {
  ku:{name:"کوردی سۆرانی",dir:"rtl",all:"هەموو",search:"گەڕان بۆ کەنال...",
      tag:"پەخشی ڕاستەوخۆ",ann:"بەخێربێیت بۆ KURDISTAN IPTV — پەخشی ڕاستەوخۆی کەناڵە کوردی و نێودەوڵەتییەکان",
      recent:"بەردەوامبە لە بینین",none:"هیچ کەناڵێک نەدۆزرایەوە",lang:"زمان",
      enter:"کۆدی چالاککردن داخڵ بکە",act:"چالاککردن",wrong:"کۆدەکە هەڵەیە",
      cats:{KURDISTAN:"کوردی",MOVIES:"فلم و دراما",SPORT:"وەرزش",KIDS:"منداڵان",QURAN:"قورئان",ARABIC:"عەرەبی",EDUCATION:"پەروەردە",MUSIC:"موزیک",DOCUMENTARY:"بەڵگەنامەیی"}},
  kb:{name:"Kurdî Badînî",dir:"rtl",all:"هەمی",search:"گەڕیان بو کەنالان...",
      tag:"پەخشا ڕاستەڤخۆ",ann:"بخێرهاتی بو KURDISTAN IPTV — پەخشا ڕاستەڤخۆ یا کەنالێن کوردی و نێڤدەولەتی",
      recent:"بەردەوام بە ل تەماشەکرنێ",none:"چ کەنال نەهاتە دیتن",lang:"زمان",
      enter:"کودێ چالاککرنێ بنڤیسە",act:"چالاککرن",wrong:"کود شاشە",
      cats:{KURDISTAN:"کوردی",MOVIES:"فیلم و دراما",SPORT:"وەرزش",KIDS:"زارۆک",QURAN:"قورئان",ARABIC:"عەرەبی",EDUCATION:"پەروەردە",MUSIC:"موزیک",DOCUMENTARY:"بەلگەنامەیی"}},
  en:{name:"English",dir:"ltr",all:"All",search:"Search channels...",
      tag:"LIVE STREAMING",ann:"Welcome to KURDISTAN IPTV — live Kurdish and international channels",
      recent:"Continue watching",none:"No channels found",lang:"Language",
      enter:"Enter your activation code",act:"Activate",wrong:"Wrong code",
      cats:{KURDISTAN:"Kurdish",MOVIES:"Movies & Drama",SPORT:"Sports",KIDS:"Kids",QURAN:"Quran",ARABIC:"Arabic",EDUCATION:"Education",MUSIC:"Music",DOCUMENTARY:"Documentary"}},
  ar:{name:"العربية",dir:"rtl",all:"الكل",search:"ابحث عن قناة...",
      tag:"بث مباشر",ann:"مرحباً بك في KURDISTAN IPTV — بث مباشر للقنوات الكردية والعالمية",
      recent:"متابعة المشاهدة",none:"لا توجد قنوات",lang:"اللغة",
      enter:"أدخل رمز التفعيل",act:"تفعيل",wrong:"الرمز غير صحيح",
      cats:{KURDISTAN:"كردي",MOVIES:"أفلام ودراما",SPORT:"رياضة",KIDS:"أطفال",QURAN:"قرآن",ARABIC:"عربي",EDUCATION:"تعليمي",MUSIC:"موسيقى",DOCUMENTARY:"وثائقي"}}
};

var lang = localStorage.kiptv_lang || "ku";
function t(){ return T[lang]; }

/* ============ helpers ============ */
var SKIP = {TV:1,HD:1,AND:1,THE:1,OF:1,"4K":1,FHD:1};
function initials(n){
  var w = n.toUpperCase().split(/[\s_\-|\/()\[\]\.]+/).filter(Boolean);
  var k = w.filter(function(x){ return !SKIP[x] });
  if(!k.length) k = w;
  if(k.length === 1) return k[0].slice(0,3);
  if(/^[0-9]+$/.test(k[1])) return (k[0].charAt(0) + k[1]).slice(0,3);
  return k[0].charAt(0) + k[1].charAt(0);
}
var TRANS = {"Ç":"c","Ê":"e","Î":"i","Û":"u","Ş":"s","Ö":"o","Ü":"u","Á":"a","É":"e","Í":"i","Ó":"o","Ú":"u","Ñ":"n"};
function hue(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }
function slug(n){
  var u = n.toUpperCase().split("").map(function(ch){ return TRANS[ch] || ch }).join("");
  return u.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

/* ============ state ============ */
var f = "ALL";
function recent(){ try{ return JSON.parse(localStorage.kiptv_recent||"[]") }catch(e){ return [] } }
function pushRecent(name){
  var r = recent().filter(function(x){return x!==name});
  r.unshift(name); localStorage.kiptv_recent = JSON.stringify(r.slice(0,6));
}

/* ============ render ============ */
function cardHTML(c){
  var h = hue(c.n), ini = initials(c.n);
  var bg = "linear-gradient(145deg,hsl("+h+",42%,34%),hsl("+((h+42)%360)+",48%,20%))";
  var img = USE_REMOTE_LOGOS
    ? '<img src="'+LOGO_BASE+slug(c.n)+'.png" loading="lazy" onerror="this.remove()" alt="">'
    : '';
  return '<div class="card" onclick=\'play('+JSON.stringify(c.u)+','+JSON.stringify(c.n)+')\'>'
       +   '<div class="tile" style="background:'+bg+'">'
       +     '<div class="mono">'+esc(ini)+'</div>'+img+'<span class="dot"></span>'
       +   '</div>'
       +   '<div class="name">'+esc(c.n)+'</div>'
       + '</div>';
}
function sectionHTML(title, list){
  return '<section><div class="shead"><span class="bar"></span><h2>'+esc(title)+'</h2>'
       + '<span class="cnt">'+list.length+'</span></div>'
       + '<div class="grid">'+list.map(cardHTML).join("")+'</div></section>';
}

function render(){
  var q = (document.getElementById("search").value||"").trim().toLowerCase();
  var list = CH.filter(function(c){
    return (f==="ALL"||c.c===f) && (!q || c.n.toLowerCase().indexOf(q)>-1);
  });
  var out = "";
  if(!q && f==="ALL"){
    var rn = recent(), rc = [];
    rn.forEach(function(n){ var m = CH.filter(function(c){return c.n===n})[0]; if(m) rc.push(m); });
    if(rc.length) out += sectionHTML(t().recent, rc);
  }
  var groups = {};
  list.forEach(function(c){ (groups[c.c] = groups[c.c]||[]).push(c) });
  var order = ["KURDISTAN","MOVIES","SPORT","KIDS","QURAN","ARABIC","EDUCATION","MUSIC","DOCUMENTARY"];
  order.forEach(function(k){ if(groups[k]) out += sectionHTML(t().cats[k]||k, groups[k]) });
  if(!list.length) out = '<div class="empty"><div>&#128533;</div><p>'+t().none+'</p></div>';
  document.getElementById("main").innerHTML = out;
}

function renderChips(){
  var cats = ["ALL"].concat(["KURDISTAN","MOVIES","SPORT","KIDS","QURAN","ARABIC","EDUCATION","MUSIC","DOCUMENTARY"]
    .filter(function(k){ return CH.some(function(c){return c.c===k}) }));
  document.getElementById("chips").innerHTML = cats.map(function(k){
    var label = k==="ALL" ? t().all : (t().cats[k]||k);
    return '<button class="chip'+(f===k?" on":"")+'" onclick="f=\''+k+'\';renderChips();render()">'+label+'</button>';
  }).join("");
}

function applyLang(){
  var d = t();
  document.documentElement.lang = lang;
  document.documentElement.dir = d.dir;
  document.getElementById("tagline").textContent = d.tag;
  document.getElementById("annText").textContent = d.ann;
  document.getElementById("search").placeholder = d.search;
  document.getElementById("gate-sub").textContent = d.enter;
  document.getElementById("gbtn").textContent = d.act;
  document.getElementById("sheetTitle").textContent = d.lang;
  renderChips(); render();
}

/* ============ actions ============ */
function play(url,title){
  pushRecent(title);
  if(window.AndroidPlayer) AndroidPlayer.playNative(url,title);
  else window.open(url,"_blank");
}
function toggleSearch(){
  var b = document.getElementById("sbox");
  b.classList.toggle("on");
  if(b.classList.contains("on")) document.getElementById("search").focus();
  else { document.getElementById("search").value=""; render(); }
}
function openSheet(){
  document.getElementById("langs").innerHTML = Object.keys(T).map(function(k){
    return '<div class="lang'+(lang===k?" on":"")+'" onclick="setLang(\''+k+'\')">'
         + '<span>'+T[k].name+'</span><span class="tick">&#10003;</span></div>';
  }).join("");
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on") }
function setLang(k){ lang=k; localStorage.kiptv_lang=k; closeSheet(); applyLang(); }

/* ============ activation ============ */
var PIN = "";
function drawPins(){
  document.getElementById("pins").innerHTML = [0,1,2,3].map(function(i){
    var cls = "pin" + (PIN[i]?" fill":"") + (i===PIN.length?" cur":"");
    return '<div class="'+cls+'">'+(PIN[i]?"&#9679;":"")+'</div>';
  }).join("");
}
function submitPin(){
  if(PIN === "1015"){
    localStorage.kiptv = "1";
    document.getElementById("gate").classList.add("hide");
  } else {
    document.getElementById("gmsg").textContent = t().wrong;
    document.querySelector(".pins").classList.add("shake");
    setTimeout(function(){
      document.querySelector(".pins").classList.remove("shake");
      PIN = ""; document.getElementById("pininput").value = ""; drawPins();
    }, 420);
  }
}
document.getElementById("pininput").addEventListener("input", function(e){
  PIN = e.target.value.replace(/\D/g,"").slice(0,4);
  e.target.value = PIN;
  document.getElementById("gmsg").textContent = "";
  drawPins();
  if(PIN.length === 4) setTimeout(submitPin, 180);
});
document.getElementById("pins").addEventListener("click", function(){
  document.getElementById("pininput").focus();
});

/* ============ boot ============ */
if(localStorage.kiptv === "1") document.getElementById("gate").classList.add("hide");
else setTimeout(function(){ document.getElementById("pininput").focus() }, 350);
drawPins();
applyLang();
