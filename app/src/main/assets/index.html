/* ==================== search: channels + films + series ====================
   Everything in the active playlist is searched at once and shown by type,
   the tab you are on first. Words can come in any order, capitals and
   accents do not matter, and Arabic / Kurdish letter forms (ك ک, ي ی ى …)
   count as the same letter. A channel found here plays through the same
   playQueue as before; films and series open their usual page. */
var SQ_TYPE = "all";              /* all | live | movie | series */
var SQ_SHOW = 48;                 /* how many are shown for one type */
var SQ_LOADING = false;

function searchNorm(s){
  s = String(s == null ? "" : s).toLowerCase();
  try{ s = s.normalize("NFD") }catch(e){}
  return s.replace(/[̀-ًͯ-ٰٟـ‌‍]/g, "")
          .replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/ة/g, "ه")
          .replace(/[أإآٱ]/g, "ا").replace(/ؤ/g, "و")
          .replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0) - 1632) })
          .replace(/[۰-۹]/g, function(d){ return String(d.charCodeAt(0) - 1776) });
}
function isWordStart(s, at){
  if(at <= 0) return true;
  return /[\s\-_|:.,\/()\[\]]/.test(s.charAt(at - 1));
}
/* every word of the query must appear; names that start with it come first */
function searchHits(list, q, toks){
  var out = [];
  for(var i = 0; i < list.length; i++){
    var c = list[i];
    if(!c || !c.n) continue;
    var s = c._s || (c._s = searchNorm(c.n));
    var ok = true;
    for(var k = 0; k < toks.length; k++) if(s.indexOf(toks[k]) < 0){ ok = false; break }
    if(!ok) continue;
    /* 0 starts with the query · 1 the whole query at a word · 2 the whole query
       anywhere · 3 the words apart, first one at a word · 4 anything else */
    var p = s.indexOf(q), score;
    if(p === 0) score = 0;
    else if(p > 0) score = isWordStart(s, p) ? 1 : 2;
    else score = isWordStart(s, s.indexOf(toks[0])) ? 3 : 4;
    out.push({ c: c, s: score, i: i });
  }
  out.sort(function(a, b){ return a.s - b.s || a.i - b.i });
  return out.map(function(x){ return x.c });
}

/* films and series of an Xtream playlist are loaded when you first search */
function searchWarm(){
  if(SQ_LOADING || !isXtream() || (LOADED.movies && LOADED.series)) return;
  SQ_LOADING = true;
  var owner = activeId();
  loadSection("movies")
    .then(function(){ return activeId() === owner ? loadSection("series") : null })
    .then(function(){
      SQ_LOADING = false;
      if(activeId() === owner && ($("search").value || "").trim()) renderSearch(true);
    });
}

function renderSearch(keepScroll){
  var d = t(), raw = ($("search").value || "").trim();
  var q = searchNorm(raw).replace(/\s+/g, " ");
  var toks = q.split(" ").filter(Boolean);
  if(!toks.length){ return }
  searchWarm();

  /* a hidden or locked group stays out of the results too */
  var res = { live: searchHits(catVisible(CH), q, toks),
              movie: LOADED.movies ? searchHits(catVisible(DATA.movies || []), q, toks) : [],
              series: LOADED.series ? searchHits(catVisible(DATA.series || []), q, toks) : [] };
  var order = SECTION === "movies" ? ["movie", "live", "series"]
            : SECTION === "series" ? ["series", "live", "movie"] : ["live", "movie", "series"];
  var types = order.filter(function(k){ return res[k].length });
  var total = types.reduce(function(n, k){ return n + res[k].length }, 0);
  if(SQ_TYPE !== "all" && !res[SQ_TYPE].length) SQ_TYPE = "all";
  var one = types.length === 1 ? types[0] : (SQ_TYPE !== "all" ? SQ_TYPE : null);
  var names = { live: d.live, movie: d.movies, series: d.series };

  /* the found channels are the next / previous queue, as before */
  view = res.live;
  shown = 0;                        /* keeps the page-scroll loader out of the way */

  var h = '<div class="srch">';
  if(types.length > 1){
    h += '<div class="chips schips">'
       + '<button class="chip'+(one ? "" : " on")+'" data-st="all">'+esc(d.all)+' · '+total+'</button>'
       + types.map(function(k){
           return '<button class="chip'+(one === k ? " on" : "")+'" data-st="'+k+'">'+esc(names[k])+' · '+res[k].length+'</button>';
         }).join("")
       + '</div>';
  }
  (one ? [one] : types).forEach(function(k){
    var list = res[k], square = k === "live";
    var lim = one ? SQ_SHOW : (square ? 12 : 9);
    h += '<section><div class="shead"><span class="bar"></span><h2>'+esc(names[k])+'</h2>'
       + '<span class="cnt">'+list.length+'</span></div>'
       + '<div class="'+(square ? "grid" : "grid posters")+'">'
       + list.slice(0, lim).map(function(c){ return cardHTML(c, square) }).join("")
       + '</div>';
    if(list.length > lim)
      h += one ? '<div class="smore"><button data-sm="1">'+esc(d.more)+'</button></div>'
               : '<div class="smore"><button data-st="'+k+'">'+esc(d.seeAll)+' · '+list.length+' &#8250;</button></div>';
    h += '</section>';
  });
  if(SQ_LOADING)
    h += '<div class="snote"><span class="sp"></span>'+esc(d.srchLoading)+'</div>';
  else if(!total)
    h += '<div class="empty"><div>&#128269;</div><p>'+esc(d.noResults.replace("%s", raw))+'</p></div>';
  h += '</div>';

  $("main").innerHTML = h;
  $("chips").style.display = "none";               /* group chips do nothing while searching */
  if(!keepScroll) window.scrollTo(0, 0);
}

/* type chips, "see all" and "show more" inside the results */
$("main").addEventListener("click", function(e){
  var el = e.target;
  while(el && el !== this && !(el.getAttribute && (el.getAttribute("data-st") || el.getAttribute("data-sm"))))

function openSeries(sid, name){
  var p = activeList();
  if(p.type !== "xtream") return;
  curMovie = null;
  detailFav("series", sid, name);
  if(!$("detail").classList.contains("on")) layerOpen("detail");   /* phone Back closes it */
  $("detail").classList.add("on");

  $("dPlot").textContent = "";
  $("dSeasons").innerHTML = "";
  $("dEps").innerHTML = '<div class="empty"><p>…</p></div>';
  $("dImg").removeAttribute("src");

  var done = function(info){
    curSeries = info;
    var i = info.info || {};
    $("dName").textContent = i.name || name || "";
    if(i.cover) $("dImg").src = i.cover;
    var bits = [];
    if(i.releaseDate || i.releasedate) bits.push(String(i.releaseDate || i.releasedate).slice(0,4));
    if(i.genre) bits.push(i.genre);
    if(i.rating) bits.push("\u2605 " + i.rating);
    $("dMeta").textContent = bits.join("  ·  ");
    $("dPlot").textContent = i.plot || "";
    var seasons = [];
    for(var k in info.episodes) if(info.episodes.hasOwnProperty(k)) seasons.push(k);
    seasons.sort(function(a,b){ return (parseInt(a,10)||0) - (parseInt(b,10)||0) });
    if(!seasons.length){ $("dEps").innerHTML = '<div class="empty"><p>-</p></div>'; return }
    curSeason = seasons[0];
    $("dSeasons").innerHTML = seasons.map(function(k){
      return '<button class="chip" data-se="'+esc(k)+'" onclick="pickSeason(\''+esc(k)+'\')">'
           + esc(t().seasonN + " " + k) + '</button>';
    }).join("");
    pickSeason(curSeason);
  };

  if(SERIES_CACHE[sid]) { done(SERIES_CACHE[sid]); return }
  xtGet(xtBase(p), "get_series_info&series_id=" + encodeURIComponent(sid))
    .then(function(info){
      if(!info || !info.episodes) throw new Error("NO EPISODES");
      SERIES_CACHE[sid] = info;
      done(info);
    })
    .catch(function(e){
      lastLoadError = (e && e.message) ? e.message : "network";
      $("dEps").innerHTML = '<div class="empty"><div>&#128533;</div><p>'+esc(t().loadFail)+'</p></div>';
    });

function fmtTime(ms){
  var t = Math.round(ms / 1000), h = Math.floor(t/3600), m = Math.floor((t%3600)/60);
  return (h ? h + "h " : "") + m + "m";
}
/* the buttons, the resume bar and the extra facts of a film.

  var d = t(), sp = getPos(url), html = '<div class="dact">';
  html += '<button class="dplay" data-play="'+esc(url)+'" data-n="'+esc(name||"")+'">&#9654;&#65038; '
       +  esc(sp ? (d.resume + "  ·  " + fmtTime(sp.p)) : d.playNow) + '</button>';

    html += '<div class="dbar"><div class="tr"><i style="width:'+pct+'%"></i></div>'

/* ==================== categories: the manager ====================
   One page for every group in a section: show it or hide it, lock it
   behind the code, and move it up or down. Nothing here touches the
   playlist itself - only what the app shows you. */
var CATSEC = "live";

function catSecOk(s){
  if(s === "live") return true;
  return isXtream() && LOADED[s] && (DATA[s] || []).length > 0;
}
function catSec(s){ if(catSecOk(s)){ CATSEC = s; drawSheet() } }
function catAt(i){ return catOrder(allGroups(CATSEC))[i] }
function catsRedraw(){ drawSheet(); catsApply() }

function catsBody(d){
  if(!catSecOk(CATSEC)) CATSEC = "live";
  var secs = [["live", d.live], ["movies", d.movies], ["series", d.series]];
  var h = '<div class="segs">' + secs.map(function(s){
      var can = catSecOk(s[0]);

           + ' onclick="catSec(\''+s[0]+'\')">'+esc(s[1])+'</button>';

    return h + '<div class="cathint" style="text-align:center;padding:26px 0">'+esc(d.catsNone)+'</div>';

  h += order.map(function(k, i){
    var hid = catHidden(k), lk = catLocked(k), tags = [];

         +   '<button class="mini'+(lk ? " on" : "")+'" onclick="catLockTap('+i+')">'+(lk ? ICON.lock : ICON.unlock)+'</button>'
         +   '<button class="mini" onclick="catUp('+i+')"'+(i === 0 ? " disabled" : "")+'>'+ICON.up+'</button>'
         +   '<button class="mini" onclick="catDown('+i+')"'+(i === order.length - 1 ? " disabled" : "")+'>'+ICON.down+'</button>'
         + '</div>';
  }).join("");

  h += '<div class="catbar">'
     +   '<button onclick="catShowAllNow()">'+esc(d.catsShowAll)+'</button>'
     +   '<button onclick="catOrderNow()">'+esc(d.catsOrder)+'</button>'

function catEye(i){ var k = catAt(i); if(k){ catToggle("hide", k); catsRedraw() } }
function catUp(i){ var k = catAt(i); if(k){ catMove(k, -1, CATSEC); catsRedraw() } }
function catDown(i){ var k = catAt(i); if(k){ catMove(k, 1, CATSEC); catsRedraw() } }
function catShowAllNow(){ catShowAll(CATSEC); catsRedraw() }
function catOrderNow(){ catOrderReset(CATSEC); catsRedraw() }

/* the first lock asks for a code; after that it is one tap */
function catLockTap(i){
  var k = catAt(i);
  if(!k) return;
  if(catLocked(k)){ catToggle("lock", k); catsRedraw(); return }
  if(!ppinHas()){ PIN_AFTER = k; pinOpen("new"); return }
  catToggle("lock", k);
  catsRedraw();
}

/* ==================== the code screen inside a sheet ====================
   new -> again = setting a code · ask = opening the locked groups
   change / remove = the old code first */
var PINMODE = "new", PINBUF = "", PINFIRST = "", PIN_AFTER = null;

function pinOpen(mode){ PINMODE = mode; PINBUF = ""; PINFIRST = ""; openSheet("ppin") }

function pinBoot(){
  var d = t(), s = $("pinSub");
  if(s) s.textContent = PINMODE === "new" ? d.pinNew
                      : PINMODE === "again" ? d.pinAgain : d.pinAsk;
  var k = $("pkeys");
  if(k) k.innerHTML = keypadHTML("pk");
  pinDraw();
  /* a remote has nowhere to start once the keys are drawn again */
  if(k && document.documentElement.classList.contains("kbd")){
    var first = k.querySelector(".key");
    if(first) setTimeout(function(){ first.focus() }, 0);
  }
}
function pinDraw(){
  var b = $("ppins");
  if(!b) return;
  b.innerHTML = [0,1,2,3].map(function(i){
    return '<div class="pin'+(PINBUF[i] ? " fill" : "")+(i === PINBUF.length ? " cur" : "")+'">'
         + (PINBUF[i] ? "&#9679;" : "") + '</div>';
  }).join("");
}
function pinFail(msg){
  var m = $("pinMsg"), b = $("ppins");
  if(m) m.textContent = msg;
  if(b) b.classList.add("shake");
  setTimeout(function(){
    if(b) b.classList.remove("shake");
    PINBUF = "";
    pinBoot();
  }, 420);
}
function pinTap(k){
  var m = $("pinMsg");
  if(m) m.textContent = "";
  if(k === "back") PINBUF = PINBUF.slice(0, -1);
  else if(PINBUF.length < 4) PINBUF += String(k).replace(/\D/g, "");
  pinDraw();
  if(PINBUF.length === 4) setTimeout(pinDone, 180);
}
function pinDone(){
  var d = t(), code = PINBUF;
  if(PINMODE === "new"){ PINFIRST = code; PINMODE = "again"; PINBUF = ""; pinBoot(); return }
  if(PINMODE === "again"){
    if(code !== PINFIRST){ PINMODE = "new"; PINFIRST = ""; pinFail(d.pinNoMatch); return }
    ppinSet(code);
    var after = PIN_AFTER;
    PIN_AFTER = null;
    if(after && !catLocked(after)) catToggle("lock", after);
    sheetBack();                       /* back to the list of groups */
    showToast(d.pinSaved);
    catsApply();
    return;
  }
  if(!ppinOk(code)){ pinFail(d.pinBad); return }
  if(PINMODE === "ask"){ PLOCK_OPEN = true; sheetBack(); showToast(d.lockOpened); catsApply(); return }
  if(PINMODE === "change"){ PINMODE = "new"; PINBUF = ""; pinBoot(); return }
  if(PINMODE === "remove"){ ppinClear(); sheetBack(); catsApply(); return }
}

/* the lock chip beside the group chips */
function lockChipTap(){
  var d = t();
  if(PLOCK_OPEN){ PLOCK_OPEN = false; showToast(d.lockClosed); catsApply(); return }
  if(!ppinHas()){ PLOCK_OPEN = true; catsApply(); return }   /* a lock with no code is no lock */
  pinOpen("ask");
}

/* ==================== layers: the phone's Back button ====================
   Every page that opens over the main view (a film or series, the settings
   tab, each sheet level) leaves one step in the page history. MainActivity
   already does webView.goBack() while webView.canGoBack() is true, so Back
   now closes the top page instead of leaving the app. With nothing open the
   history is empty and Back leaves the app exactly as before. */
var LAYERS = [];

function layerOpen(name){
  LAYERS.push(name);
  try{ history.pushState({ k: LAYERS.length }, "") }catch(e){}
}
/* close the top n layers, the same way Back does */
function layerBack(n){
  n = Math.min(n || 1, LAYERS.length);
  if(n < 1) return;
  try{ history.go(-n) }catch(e){ layerUnwind(LAYERS.length - n) }
}
/* close one named layer and anything that is open above it */
function layerClose(name){
  var i = LAYERS.lastIndexOf(name);
  if(i > -1) layerBack(LAYERS.length - i);
  else layerHide(name);
}
function layerUnwind(depth){
  while(LAYERS.length > depth) layerHide(LAYERS.pop());
}
function layerHide(name){
  if(name === "detail") $("detail").classList.remove("on");
  else if(name === "settings"){ $("settings").classList.remove("on"); drawNav() }
  else if(name === "favs"){ $("favs").classList.remove("on"); drawNav() }
  else if(name === "search"){
    $("sbox").classList.remove("on");
    $("search").value = ""; $("search").blur();
    render();
  }
  else if(name === "sheet"){
    sheetStack.pop();
    if(!sheetStack.length) $("sheet").classList.remove("on");
    else drawSheet();
  }
}
window.addEventListener("popstate", function(e){
  layerUnwind((e.state && e.state.k) || 0);
});

function updTimes(){ try{ return JSON.parse(lsGet("kiptv_upd", "{}")) || {} }catch(e){ return {} } }
function markUpdated(id){ var m = updTimes(); m[id] = Date.now(); lsSet("kiptv_upd", JSON.stringify(m)) }
function fmtWhen(ts){
  if(!ts) return t().notYet;
  var d = new Date(ts), now = new Date();
  function two(n){ return (n < 10 ? "0" : "") + n }
  var hm = two(d.getHours()) + ":" + two(d.getMinutes());
  if(d.toDateString() === now.toDateString()) return hm;
  return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()) + " " + hm;
}
function cacheSize(){
  var n = 0;
  try{ n = (localStorage.getItem("kiptv_cache") || "").length * 2 }catch(e){}
  /* ⁦ ... ⁩ keeps "7.1 MB" in that order inside Kurdish / Arabic text */
  var s = n === 0 ? "0 KB" : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB"
                                         : (n / 1048576).toFixed(1) + " MB";
  return "⁦" + s + "⁩";
}

  if(c.lock.length) p.push(d.lockedW + " " + c.lock.length);

}

/* "Last updated 03:25 · 7.1 MB · 18 Mbps" - every number really happened */
function updLine(d, when){
  if(SYNCING) return d.updating;
  var line = d.lastUpd + " " + fmtWhen(when);
  if(LAST_DL && LAST_DL.bytes > 0){
    line += "  ·  " + fmtSize(LAST_DL.bytes)
          + "  ·  " + fmtRate(LAST_DL.bytes / (LAST_DL.ms / 1000));
  }
  return line;
}

function saveEdit(){
  var d = t(), err = $("formErr"), a = getLists(), at = -1;
  for(var i = 0; i < a.length; i++) if(a[i].id === EDIT_ID) at = i;
  if(at < 0 || EDIT_ID === DEFAULT_PLAYLIST.id){ closeSheet(); return }
  var old = a[at];
  var name = ($("pl_name").value || "").trim();
  if(!name){ err.textContent = d.errName; return }
  var p = { id: old.id, name: name, type: old.type };
  if(old.type === "m3u"){
    var url = ($("pl_url").value || "").trim();
    if(!/^https?:\/\//i.test(url)){ err.textContent = d.errUrl; return }
    p.url = url;
  } else {
    var dom = ($("pl_domain").value || "").trim();
    var u = ($("pl_user").value || "").trim();
    var pw = ($("pl_pass").value || "").trim();
    if(!/^https?:\/\//i.test(dom)){ err.textContent = d.errDomain; return }
    if(!u || !pw){ err.textContent = d.errUser; return }
    p.domain = dom.replace(/\/+$/,""); p.user = u; p.pass = pw;
  }
  var changed = JSON.stringify(listUrl(old)) !== JSON.stringify(listUrl(p));

/* ==================== favourites ====================
   Kept per playlist in kiptv_favs = { listId: [ {k,t,n,u|sid,l,c,r,ua,rf,at} ] }.
   A long press on any card adds it or takes it away; the Favourites tab
   shows them. Nothing here touches how a stream is played - a favourite
   is handed to exactly the same playQueue / openMovie / openSeries. */
var FAV_MS = 550;                 /* how long to hold a card */
var favIdx = null, favIdxOwner = null;
var FAVF = "all";                 /* type filter on the favourites page */
var DFAV = null;                  /* what the film / series page is showing */

function favStore(){ try{ return JSON.parse(lsGet("kiptv_favs", "{}")) || {} }catch(e){ return {} } }
function favList(){ return (favStore()[activeId()] || []).slice() }
function favSave(list){

  lsSet("kiptv_favs", JSON.stringify(s));

}
function favDropList(id){ var s = favStore(); if(s[id]){ delete s[id]; lsSet("kiptv_favs", JSON.stringify(s)) } favIdx = null }
function favKey(c){ return c.sid ? "s:" + c.sid : "u:" + (c.u || "") }
/* live / movie / series - an episode on its own is not a favourite */
function favType(c){
  if(c.sid) return "series";
  var u = c.u || "";
  if(!u) return "";
  if(/\/movie\//.test(u)) return "movie";
  if(/\/series\//.test(u)) return "";
  return "live";
}
function isFav(c){
  var owner = lsGet("kiptv_active", "");
  if(!favIdx || favIdxOwner !== owner){
    favIdx = {}; favIdxOwner = owner;
    favList().forEach(function(f){ favIdx[f.k] = 1 });
  }
  return !!favIdx[favKey(c)];
}
function favFind(k){ var a = favList(); for(var i = 0; i < a.length; i++) if(a[i].k === k) return a[i]; return null }

/* returns true when added, false when removed, null when it cannot be a favourite */
function toggleFav(c){
  var ty = favType(c); if(!ty) return null;
  var list = favList(), k = favKey(c);
  for(var i = 0; i < list.length; i++) if(list[i].k === k){
    list.splice(i, 1); favSave(list); showToast(t().favRemoved); return false;
  }
  var o = { k: k, t: ty, n: c.n || "", l: c.l || "", c: c.c || "", at: Date.now() };
  if(c.u) o.u = c.u;
  if(c.sid) o.sid = c.sid;
  if(c.r) o.r = c.r;
  if(c.ua) o.ua = c.ua;
  if(c.rf) o.rf = c.rf;
  list.push(o); favSave(list); showToast(t().favAdded);
  return true;
}

/* the full item behind a card on screen */
function itemForCard(el){
  var sid = el.getAttribute("data-sid"), u = el.getAttribute("data-u"), n = el.getAttribute("data-n") || "";
  if(sid){
    var s = DATA.series || [];
    for(var i = 0; i < s.length; i++) if(String(s[i].sid) === sid) return s[i];
    return favFind("s:" + sid) || { sid: sid, n: n };
  }
  if(!u) return null;
  var pools = [view || [], CH, DATA.movies || []];
  for(var p = 0; p < pools.length; p++)
    for(var j = 0; j < pools[p].length; j++) if(pools[p][j].u === u) return pools[p][j];
  return favFind("u:" + u) || { u: u, n: n };
}
/* every copy of this card on screen gets (or loses) its star */
function markCards(c, on){
  var cards = document.querySelectorAll(".card"), sid = c.sid ? String(c.sid) : null;
  for(var i = 0; i < cards.length; i++){
    var hit = sid ? cards[i].getAttribute("data-sid") === sid
                  : (c.u && cards[i].getAttribute("data-u") === c.u);
    if(hit) cards[i].classList.toggle("fav", on);
  }
}

var toastT = null;
function showToast(msg){

  el.textContent = msg;
  el.className = "on";
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.className = "" }, 1800);
}

function longPress(card){
  var it = itemForCard(card); if(!it) return;
  var on = toggleFav(it);

/* hold a card for FAV_MS without moving: add / remove it.
   The tap that ends a long press does not also play the card. */
(function(){
  var timer = null, x0 = 0, y0 = 0, fired = false, swallowUntil = 0;
  function cardOf(el){
    while(el && el.nodeType === 1){
      if(el.classList.contains("card")) return el;
      el = el.parentNode;
    }
    return null;
  }
  function cancel(){ if(timer){ clearTimeout(timer); timer = null } }
  function start(e){
    cancel(); fired = false;
    var card = cardOf(e.target); if(!card || !e.touches || e.touches.length > 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    timer = setTimeout(function(){ timer = null; fired = true; longPress(card) }, FAV_MS);
  }
  function move(e){
    if(!timer || !e.touches) return;
    var p = e.touches[0];
    if(Math.abs(p.clientX - x0) > 10 || Math.abs(p.clientY - y0) > 10) cancel();   /* a scroll */
  }
  function end(e){
    cancel();
    if(fired){ fired = false; swallowUntil = Date.now() + 450; if(e.cancelable) e.preventDefault() }
  }
  [$("main"), $("favs")].forEach(function(box){
    box.addEventListener("touchstart", start, { passive: true });
    box.addEventListener("touchmove", move, { passive: true });
    box.addEventListener("touchend", end, false);
    box.addEventListener("touchcancel", cancel, { passive: true });
    box.addEventListener("contextmenu", function(e){ if(cardOf(e.target)) e.preventDefault() });
    box.addEventListener("click", function(e){
      if(Date.now() < swallowUntil){ swallowUntil = 0; e.stopPropagation(); e.preventDefault() }
    }, true);
  });
})();

/* ==================== watch history ====================
   Every channel, film and episode you start from the app is written here,

   playQueue / openMovie as everywhere else. */
var HIST_MAX = 100;
var FAVMODE = "fav";              /* fav | hist - which half of the tab is shown */

function histSave(list){ var s = histStore(); s[activeId()] = list; lsSet("kiptv_hist", JSON.stringify(s)) }

function dayLabel(ts){

  if(d.toDateString() === y.toDateString()) return t().yesterday;
  function two(n){ return (n < 10 ? "0" : "") + n }
  return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate());
}
function clockOf(ts){
  var d = new Date(ts);
  function two(n){ return (n < 10 ? "0" : "") + n }
  return two(d.getHours()) + ":" + two(d.getMinutes());
}

function histPlay(i){

    return;
  }
  if(x.t === "episode"){ playQueue([{ n: x.n, u: x.u, l: x.l, c: x.c }], 0); return }
  /* live: the channels in the history are the next / previous queue, each
     as it is in the list right now (fresh user agent / referrer) */
  var fresh = {};
  for(var k = 0; k < CH.length; k++) fresh[CH[k].u] = CH[k];
  var q = [], at = 0;
  HIST_VIEW.forEach(function(h, j){
    if(h.t !== "live") return;
    if(j === i) at = q.length;

  playQueue(q, at);
}

/* ==================== TV remote / keyboard ====================
   The arrows move a highlight to the nearest item in that direction, OK
   (Enter) opens it, holding OK on a card adds / removes it as a favourite,
   and Back closes the top page as on a phone. Only the page on top is
   searched, so the highlight never slips behind an open page. Nothing
   here runs for touches: a phone behaves exactly as before. */
var TV = false;
try{ TV = !!(window.AndroidPlayer && AndroidPlayer.isTv && AndroidPlayer.isTv()) }catch(e){}
var NAV_SEL = 'button, input, .card, .row, .ep, .hi, .hero.on, #pins';
var tvMem = {};                    /* last highlighted item, per page */
var okDown = 0, okTimer = null, okFired = false;

function kbdOn(){ document.documentElement.classList.add("kbd") }
function kbdOff(){ document.documentElement.classList.remove("kbd") }

/* the page on top: a sheet, the film page, settings, favourites or the main page */
function navRoots(){
  if(!$("gate").classList.contains("hide")) return [$("gate")];
  for(var i = LAYERS.length - 1; i >= 0; i--){
    var n = LAYERS[i];
    if(n === "sheet") return [$("sheet")];
    if(n === "detail") return [$("detail")];
    if(n === "settings") return [$("settings")];
    if(n === "favs") return [$("favs"), $("nav")];
  }
  return [document.querySelector("header"), $("main"), $("nav")];
}
function navKey(){ var r = navRoots()[0]; return r.id || r.tagName }

function navShown(el){
  if(!el.getClientRects().length) return false;
  var r = el.getBoundingClientRect();
  if(r.width < 2 || r.height < 2) return false;
  if(el.classList.contains("card")) return true;
  var cs = getComputedStyle(el);
  return cs.visibility !== "hidden" && cs.opacity !== "0" && !el.disabled;
}
function navItems(){
  var out = [];
  navRoots().forEach(function(root){
    if(!root) return;
    var list = root.querySelectorAll(NAV_SEL);
    for(var i = 0; i < list.length; i++) if(navShown(list[i])) out.push(list[i]);
  });
  return out;
}
/* which area of the page an item belongs to (header / list / tab bar ...) */
function navArea(el){
  var roots = navRoots();
  for(var i = 0; i < roots.length; i++) if(roots[i] && roots[i].contains(el)) return roots[i];
  return null;
}
/* Stay inside the same area first: the list scrolls under the pinned header,
   so Up must reach the banner before the header, not jump over it. Only when
   nothing is left that way does the highlight step into the next area. */
function navNext(from, dir, items){
  var area = navArea(from);
  var same = items.filter(function(el){ return navArea(el) === area });
  var hit = navPick(from, dir, same);
  if(hit) return hit;
  var others = items.filter(function(el){ return navArea(el) !== area });
  hit = navPick(from, dir, others);
  if(!hit) return null;
  /* entering the list again: go back to where the highlight was in it */
  var target = navArea(hit), m = tvMem[navKey() + ":" + (target && target.id)];
  if(m && m.isConnected && items.indexOf(m) > -1 && navArea(m) === target){
    var r = m.getBoundingClientRect();
    if(r.bottom > 0 && r.top < window.innerHeight) return m;
  }
  return hit;
}

/* The part of an item that can be seen: the list scrolls under the pinned
   header (and, on a TV, under the tab bar at the top). A hidden part must not
   count, or Up would think the header is "inside" the banner. */
function navRect(el){
  var r = el.getBoundingClientRect(), top = 0, bottom = window.innerHeight;
  var area = navArea(el), nav = $("nav"), hdr = document.querySelector("header");
  var tvNav = document.documentElement.classList.contains("tv") && nav.classList.contains("on");
  if(area === $("main")){
    top = hdr.getBoundingClientRect().bottom;
    if(!tvNav && nav.classList.contains("on")) bottom = nav.getBoundingClientRect().top;
  } else if(area === $("favs")){
    if(tvNav) top = nav.getBoundingClientRect().bottom;
    else if(nav.classList.contains("on")) bottom = nav.getBoundingClientRect().top;
  }
  var t = Math.max(r.top, top), b = Math.min(r.bottom, bottom);
  if(b - t < 8) return r;                     /* out of view: use where it really is */
  return { left: r.left, right: r.right, top: t, bottom: b, width: r.width, height: b - t };
}

/* nearest item in a direction: straight lines first, then the closest */
function navPick(from, dir, items){
  var a = navRect(from);
  var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  var best = null, bestScore = Infinity;
  for(var i = 0; i < items.length; i++){
    var el = items[i];
    if(el === from || el.contains(from)) continue;
    var b = navRect(el);
    var bx = b.left + b.width / 2, by = b.top + b.height / 2, main, cross, ov;
    if(dir === "left" || dir === "right"){
      if(dir === "right" ? (bx <= ax + 1 || b.right <= a.right) : (bx >= ax - 1 || b.left >= a.left)) continue;
      main = dir === "right" ? Math.max(0, b.left - a.right) : Math.max(0, a.left - b.right);
      ov = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      cross = ov > 0 ? 0 : Math.abs(by - ay);
      if(ov <= 0 && cross > Math.max(a.height, b.height) * 1.5) continue;   /* another row */
    } else {
      if(dir === "down" ? (by <= ay + 1 || b.bottom <= a.bottom) : (by >= ay - 1 || b.top >= a.top)) continue;
      main = dir === "down" ? Math.max(0, b.top - a.bottom) : Math.max(0, a.top - b.bottom);
      ov = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      cross = Math.abs(bx - ax) * (ov > 0 ? 0.25 : 1);
    }

    return '<div class="pin'+(PIN[i]?" fill":"")+(i===PIN.length?" cur":"")+'">'+(PIN[i]?"&#9679;":"")+'</div>';
  }).join("");
  var b = $("gbtn");
  if(b) b.className = "gbtn" + (PIN.length === PIN_LEN ? "" : " off");
}

/* the keypad - every key is a real button, so a TV remote can reach it.
   The same nine keys serve the activation screen and the lock code. */
function keypadHTML(attr){
  var a = "data-" + (attr || "k"), html = "";
  for(var i = 1; i <= 9; i++) html += '<button class="key" '+a+'="'+i+'">'+i+'</button>';
  return html + '<button class="key ghost" '+a+'="back" aria-label="back">'+KEY_BACK+'</button>'
              + '<button class="key" '+a+'="0">0</button>'
              + '<button class="key hide" tabindex="-1"></button>';
}
function drawKeys(){
  var k = $("keys");
  if(k) k.innerHTML = keypadHTML("k");
}

/* one place where the code changes, whatever was pressed */
function pinSet(v){
  if(ACT_BUSY) return;                       /* the server is being asked - wait */
  PIN = String(v).replace(/\D/g,"").slice(0,PIN_LEN);
  var inp = $("pininput");
  if(inp) inp.value = PIN;
  $("gmsg").textContent = "";
  drawPins();
  if(PIN.length === PIN_LEN) setTimeout(submitPin, 180);
}
function pinKey(k){
  if(k === "back") pinSet(PIN.slice(0, -1));
  else if(PIN.length < PIN_LEN) pinSet(PIN + k);
}
/* ==================== the activation code ====================
   The owner's own code opens the app straight away, with no internet.
   Every other code is asked about once, and the answer is kept: after that
   the app opens by itself until the code's end date, or for a week without
   internet, whichever comes first. */
var ACT_BUSY = false;

/* a name this phone keeps, so wrong tries can be counted per device */
function actDevice(){
  var d = lsGet("kiptv_dev", "");
  if(!d){
    d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    lsSet("kiptv_dev", d);
  }
  return d;
}
function actRead(){ try{ return JSON.parse(lsGet("kiptv_act", "")) || null }catch(e){ return null } }
function actSave(code, until){
  lsSet("kiptv", "1");
  lsSet("kiptv_act", JSON.stringify({ c: code, u: until || "", t: Date.now() }));
}
function actForget(){
  try{ localStorage.removeItem("kiptv"); localStorage.removeItem("kiptv_act") }catch(e){}
}

/* one question to the server: is this code good? Never throws. */
function actAsk(code){
  if(!window.fetch) return Promise.resolve({ ok: false, reason: "net" });
  var u = ACT_URL + "?code=" + encodeURIComponent(code) + "&device=" + encodeURIComponent(actDevice());
  return fetch(viaApp(u), { method: "GET" })
    .then(function(r){ return r.text() })
    .then(function(x){
      var o = null;
      try{ o = JSON.parse(x) }catch(e){}
      return (o && typeof o.ok === "boolean") ? o : { ok: false, reason: "net" };
    })
    .catch(function(){ return { ok: false, reason: "net" } });
}

function actMessage(reason){
  var d = t();
  return reason === "expired" ? d.actExpired
       : reason === "off"     ? d.actOff
       : reason === "devices" ? d.actDevices
       : reason === "wait"    ? d.actWait
       : (reason === "net" || reason === "server") ? d.actNet
       : d.wrong;
}

function gateFail(msg){
  $("gmsg").textContent = msg;
  var p = document.querySelector("#gate .pins");
  if(p) p.classList.add("shake");
  setTimeout(function(){
    if(p) p.classList.remove("shake");
    PIN = "";
    var inp = $("pininput"); if(inp) inp.value = "";
    drawPins();
    if(!$("gate").classList.contains("hide") && document.documentElement.classList.contains("kbd")){
      var first = $("keys").querySelector(".key");
      if(first) first.focus();
    }
  }, 420);
}

function gateOpen(){
  PIN = "";
  var inp = $("pininput"); if(inp) inp.value = "";
  $("gmsg").textContent = "";
  drawPins();
  $("gate").classList.remove("hide");
}

function submitPin(){
  if(ACT_BUSY) return;
  var code = PIN;
  if(code === PIN_CODE){                      /* the owner's key: no internet needed */
    lsSet("kiptv", "1");
    try{ localStorage.removeItem("kiptv_act") }catch(e){}
    $("gate").classList.add("hide");
    return;
  }
  if(code.length !== PIN_LEN){ gateFail(t().wrong); return }

  ACT_BUSY = true;
  $("gmsg").textContent = t().actChecking;
  var b = $("gbtn"); if(b) b.className = "gbtn off";

  actAsk(code).then(function(r){
    ACT_BUSY = false;
    if(r && r.ok){
      actSave(code, r.until);
      $("gmsg").textContent = "";
      $("gate").classList.add("hide");
      return;
    }
    gateFail(actMessage(r && r.reason));
  });
}
$("pininput").addEventListener("input", function(e){ pinSet(e.target.value) });

$("keys").addEventListener("click", function(e){
  var el = e.target;
  while(el && el !== this && !el.getAttribute("data-k")) el = el.parentNode;
  if(el && el !== this) pinKey(el.getAttribute("data-k"));
});

/* the lock code's own keypad lives inside a sheet, so it is drawn again
   every time - one listener on the sheet body catches all of its keys */
$("sheetBody").addEventListener("click", function(e){
  var el = e.target;
  while(el && el !== this && !(el.getAttribute && el.getAttribute("data-pk"))) el = el.parentNode;
  if(el && el !== this) pinTap(el.getAttribute("data-pk"));
});
document.addEventListener("keydown", function(e){
  if(!$("sheet").classList.contains("on")) return;
  if(sheetStack[sheetStack.length - 1] !== "ppin") return;
  if(e.key >= "0" && e.key <= "9"){ pinTap(e.key); e.preventDefault() }
  else if(e.key === "Backspace"){ pinTap("back"); e.preventDefault() }
});

/* a keyboard, a TV remote's number keys, or a barcode-style entry all work */
document.addEventListener("keydown", function(e){
  if($("gate").classList.contains("hide")) return;
  if(e.key >= "0" && e.key <= "9"){ pinKey(e.key); e.preventDefault() }
  else if(e.key === "Backspace"){ pinKey("back"); e.preventDefault() }
  else if(e.key === "Enter" && PIN.length === PIN_LEN && document.activeElement === document.body) submitPin();
});

/* ==================== loading ==================== */
var lastLoadError = "";

/* Inside the app, downloads go through native code (no CORS limits).
   In a plain browser the URL is used directly. */
function viaApp(u){
  return window.AndroidPlayer ? "https://kiptv.local/p?u=" + encodeURIComponent(u) : u;
}

function setData(list){ CH = list; epgReset(); buildGroups(); renderChips(); render() }
function showSync(text, isErr){
  var el = $("sync");
  $("syncText").textContent = text;
  el.className = "on" + (isErr ? " err" : "");
  el.onclick = isErr ? function(){ window.alert(lastLoadError || "-") } : null;
  if(isErr) setTimeout(function(){ el.className = "" }, 7000);
}
function hideSync(){ $("sync").className = "" }

/* what the last playlist download really cost, and whether one is running */
var SYNCING = false, LAST_DL = null, DL_BYTES = 0;

/* the size of a text answer in bytes, not characters */
function byteLen(txt){
  try{ return new Blob([txt]).size }catch(e){ return (txt || "").length }
}
function fmtSize(n){
  var s = n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1) + " MB";
  return "\u2066" + s + "\u2069";
}
function fmtRate(bytesPerSec){
  var mbps = bytesPerSec * 8 / 1000000;
  var s = mbps >= 10 ? mbps.toFixed(0) + " Mbps" : mbps.toFixed(1) + " Mbps";
  return "\u2066" + s + "\u2069";
}

function loadActive(force){
  var p = activeList(), url = listUrl(p);
  $("tagline").textContent = p.name;
  SECTION = "live";
  DATA = { live: [], movies: [], series: [] };
  LOADED = { live: false, movies: false, series: false };
  SERIES_CACHE = {};
  catsReset();                    /* every playlist keeps its own groups */
  CATSEC = "live";
  drawNav();
  refreshSettings();
  refreshFavs();

  var cached = force ? null : loadCache(p.id);
  if(cached && cached.length) setData(cached);
  else if(!CH.length) setData((window.CHANNELS || []).map(function(c){ return {c:c.c,n:c.n,u:c.u,l:""} }));

  if(!url || !window.fetch) return;
  showSync(t().sync + " · " + p.name, false);
  SYNCING = true;
  LAST_DL = null;
  DL_BYTES = 0;
  var dlStart = Date.now();
  refreshSettings();

  var job = (p.type === "xtream") ? loadXtream(p) :
    fetch(viaApp(url))
      .then(function(r){
        return r.text().then(function(txt){
          if(!r.ok) throw new Error("HTTP " + r.status + " " + txt.slice(0,120));
          if(txt.indexOf("PROXY_ERROR") === 0) throw new Error(txt.slice(0,140));
          DL_BYTES += byteLen(txt);
          var list = parseM3U(txt);
          if(list.length < 1) throw new Error("EMPTY (" + txt.slice(0,80).replace(/\s+/g," ") + ")");
          return list;
        });
      });

  job
    .then(function(list){
      if(!list || !list.length) throw new Error("NO CHANNELS");
      f = "";
      setData(list);
      saveCache(p.id, list);
      hideSync();
      markUpdated(p.id);
      SYNCING = false;
      LAST_DL = { bytes: DL_BYTES, ms: Math.max(1, Date.now() - dlStart) };
      refreshSettings();
    })
    .catch(function(e){
      lastLoadError = (e && e.message) ? e.message : "network";
      SYNCING = false;
      refreshSettings();
      showSync(t().loadFail + " · " + p.name, true);
    });
}

/* ==================== what happens at every start ====================
   never activated            -> the code screen
   the owner's own key        -> straight in, nothing to ask
   a code with an end date    -> in, unless that date has passed
   a code not checked for a
   week                       -> the code screen, while the server is asked */
function actBoot(){
  if(lsGet("kiptv", "") !== "1") return;              /* the code screen stays */
  var a = actRead();
  if(!a || !a.c){ $("gate").classList.add("hide"); return }   /* owner's key, or an older install */

  var now = Date.now(),
      ends = a.u ? Date.parse(a.u) : 0,
      age  = now - (a.t || 0);

  if(ends && now > ends){ actForget(); return }        /* the date has passed */
  if(age > ACT_GRACE){ actAskAgainNow(a); return }     /* too long unchecked */

  $("gate").classList.add("hide");
  if(age > 6 * 3600 * 1000) actAskAgainQuietly(a);
}

/* past the week: the app waits at the code screen for one answer */
function actAskAgainNow(a){
  ACT_BUSY = true;
  setTimeout(function(){ $("gmsg").textContent = t().actChecking }, 0);
  actAsk(a.c).then(function(r){
    ACT_BUSY = false;
    if(r && r.ok){
      actSave(a.c, r.until);
      $("gmsg").textContent = "";
      $("gate").classList.add("hide");
      return;
    }
    if(r && (r.reason === "net" || r.reason === "server" || r.reason === "wait")){
      $("gmsg").textContent = t().actNet;              /* still locked, can try again */
      return;
    }
    actForget();
    $("gmsg").textContent = actMessage(r && r.reason);
  });
}

/* inside the week: asked without the user noticing; only a real "no" closes */
function actAskAgainQuietly(a){
  actAsk(a.c).then(function(r){
    if(!r) return;
    if(r.ok){ actSave(a.c, r.until); return }
    if(r.reason === "net" || r.reason === "server" || r.reason === "wait") return;
    actForget();
    gateOpen();
    $("gmsg").textContent = actMessage(r.reason);
  });
}

/* ==================== boot ==================== */
(function boot(){
  $("glogo").innerHTML = LOGO_SVG;
  actBoot();
  drawKeys();
  drawPins();
  drawNav();
  applyLang();
  loadActive(false);
})();
</script>
