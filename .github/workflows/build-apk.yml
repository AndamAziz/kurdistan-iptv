name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # the signing key and its passwords live in the repository's secrets,
    # never in the code. Without them the build still works, unsigned (debug).
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Take out the signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kiptv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kiptv.jks" >> "$GITHUB_ENV"
            echo "Signed build: the key was found."
          else
            echo "No key in the secrets - building the debug APK as before."
          fi

      - name: Build the APK
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/kiptv.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-IPTV-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      # The finished APK goes to a second, public repository that holds nothing
      # but releases. This source stays private; the app asks that public list
      # what the newest build is, so it needs no key of its own to ask.
      # Without RELEASE_TOKEN in the secrets nothing is published and the build
      # ends exactly as it always did.
      - name: Publish the new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: AndamAziz/kurdistan-iptv-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_TOKEN in the secrets - nothing published."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No signed APK was built - nothing published."
            exit 0
          fi
          NAME="KURDISTAN-IPTV-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$NAME"
          if [ -s WHATSNEW.md ]; then
            NOTES=$(cat WHATSNEW.md)
          else
            NOTES=$(git log -1 --pretty=%B)
          fi
          # the app reads the number at the end of the tag as the build number
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" "$NAME" \
            --repo "$RELEASE_REPO" \
            --title "KURDISTAN IPTV 1.0 (${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"
          echo "Published v1.0.${GITHUB_RUN_NUMBER} to $RELEASE_REPO"

  # ---------------------------------------------------------------------------
  # The Windows app: the same page, carried by Electron, playing with mpv.
  # It goes into the SAME release the phone build just made, beside the APK -
  # the app asks for whichever of the two suits the machine it is running on.
  #
  # Nothing here can hold up or redden the phone build: it waits for it, and
  # any trouble of its own is its own.
  # ---------------------------------------------------------------------------
  windows:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # mpv is what makes this worth having: a browser plays neither a live
      # MPEG-TS stream nor HEVC nor Matroska, and a panel sends all three.
      - name: Fetch mpv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ 'User-Agent' = 'kiptv-build' }
          if ($env:GITHUB_TOKEN) { $h['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Headers $h `
            'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mpv-x86_64-\d' -and $_.name -notmatch 'dev' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no mpv build found in the latest release' }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest -Headers $h -Uri $asset.browser_download_url -OutFile mpv.7z
          New-Item -ItemType Directory -Force -Path desktop/mpv | Out-Null
          & 7z x mpv.7z -odesktop/mpv -y | Out-Null
          if (-not (Test-Path desktop/mpv/mpv.exe)) { throw 'mpv.exe is not where it should be' }
          '{0:N1} MB' -f ((Get-Item desktop/mpv/mpv.exe).Length / 1MB)
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The build number has to travel inside the app. It used to be read from
      # the environment when the app ran, which works on the machine that
      # builds it and nowhere else - so every copy called itself build 1 and
      # could never tell it was out of date.
      - name: Stamp the build number
        working-directory: desktop
        shell: bash
        env:
          KIPTV_BUILD: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '1.0.' + process.env.KIPTV_BUILD;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version = ' + p.version);
          "

      - name: Build the installer
        working-directory: desktop
        env:
          KIPTV_BUILD: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-IPTV-windows
          path: desktop/out/*.exe
          if-no-files-found: error

      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: AndamAziz/kurdistan-iptv-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_TOKEN in the secrets - nothing published."
            exit 0
          fi
          EXE=$(ls desktop/out/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "No installer was built - nothing published."
            exit 0
          fi
          # beside the APK, in the release the phone build made a moment ago
          gh release upload "v1.0.${GITHUB_RUN_NUMBER}" "$EXE" \
            --repo "$RELEASE_REPO" --clobber
          echo "Added $(basename "$EXE") to v1.0.${GITHUB_RUN_NUMBER}"
