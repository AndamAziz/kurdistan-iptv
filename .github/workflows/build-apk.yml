name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # the signing key and its passwords live in the repository's secrets,
    # never in the code. Without them the build still works, unsigned (debug).
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Take out the signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/kiptv.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kiptv.jks" >> "$GITHUB_ENV"
            echo "Signed build: the key was found."
          else
            echo "No key in the secrets - building the debug APK as before."
          fi

      - name: Build the APK
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # Google Play takes a bundle rather than an APK. It is built here, from
      # the same source and the same key, straight after the APK - and if it
      # fails, it fails alone: the APK is already made and its release goes out
      # exactly as it always did.
      - name: Build the bundle for Play
        if: env.KEYSTORE_FILE != ''
        continue-on-error: true
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/kiptv.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-IPTV-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      # kept for the job that sends it to Play. A missing one is only a warning
      # here: nothing else depends on it.
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-IPTV-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      # The finished APK goes to a second, public repository that holds nothing
      # but releases. This source stays private; the app asks that public list
      # what the newest build is, so it needs no key of its own to ask.
      # Without RELEASE_TOKEN in the secrets nothing is published and the build
      # ends exactly as it always did.
      - name: Publish the new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: AndamAziz/kurdistan-iptv-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_TOKEN in the secrets - nothing published."
            exit 0
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "No signed APK was built - nothing published."
            exit 0
          fi
          NAME="KURDISTAN-IPTV-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$NAME"
          # a second copy of the very same APK under a name that never changes,
          # so one fixed address always points at the newest build:
          #   .../releases/latest/download/KURDISTAN-IPTV.apk
          # It is uploaded after the numbered one, which therefore stays the
          # first .apk in the release - the app picks that one exactly as before.
          SAME="KURDISTAN-IPTV.apk"
          cp "$APK" "$SAME"
          if [ -s WHATSNEW.md ]; then
            NOTES=$(cat WHATSNEW.md)
          else
            NOTES=$(git log -1 --pretty=%B)
          fi
          # the app reads the number at the end of the tag as the build number
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" "$NAME" "$SAME" \
            --repo "$RELEASE_REPO" \
            --title "KURDISTAN IPTV 1.0 (${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES"
          echo "Published v1.0.${GITHUB_RUN_NUMBER} to $RELEASE_REPO"

  # ---------------------------------------------------------------------------
  # The Windows app: the same page, carried by Electron, playing with mpv.
  # It goes into the SAME release the phone build just made, beside the APK -
  # the app asks for whichever of the two suits the machine it is running on.
  #
  # Nothing here can hold up or redden the phone build: it waits for it, and
  # any trouble of its own is its own.
  # ---------------------------------------------------------------------------
  windows:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # mpv is what makes this worth having: a browser plays neither a live
      # MPEG-TS stream nor HEVC nor Matroska, and a panel sends all three.
      - name: Fetch mpv
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ 'User-Agent' = 'kiptv-build' }
          if ($env:GITHUB_TOKEN) { $h['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Headers $h `
            'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $rel.assets |
            Where-Object { $_.name -match '^mpv-x86_64-\d' -and $_.name -notmatch 'dev' } |
            Select-Object -First 1
          if (-not $asset) { throw 'no mpv build found in the latest release' }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest -Headers $h -Uri $asset.browser_download_url -OutFile mpv.7z
          New-Item -ItemType Directory -Force -Path desktop/mpv | Out-Null
          & 7z x mpv.7z -odesktop/mpv -y | Out-Null
          if (-not (Test-Path desktop/mpv/mpv.exe)) { throw 'mpv.exe is not where it should be' }
          '{0:N1} MB' -f ((Get-Item desktop/mpv/mpv.exe).Length / 1MB)
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The build number has to travel inside the app. It used to be read from
      # the environment when the app ran, which works on the machine that
      # builds it and nowhere else - so every copy called itself build 1 and
      # could never tell it was out of date.
      - name: Stamp the build number
        working-directory: desktop
        shell: bash
        env:
          KIPTV_BUILD: ${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '1.0.' + process.env.KIPTV_BUILD;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version = ' + p.version);
          "

      - name: Build the installer
        working-directory: desktop
        env:
          KIPTV_BUILD: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KURDISTAN-IPTV-windows
          path: desktop/out/*.exe
          if-no-files-found: error

      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: AndamAziz/kurdistan-iptv-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_TOKEN in the secrets - nothing published."
            exit 0
          fi
          EXE=$(ls desktop/out/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "No installer was built - nothing published."
            exit 0
          fi
          # beside the APK, in the release the phone build made a moment ago
          gh release upload "v1.0.${GITHUB_RUN_NUMBER}" "$EXE" \
            --repo "$RELEASE_REPO" --clobber
          echo "Added $(basename "$EXE") to v1.0.${GITHUB_RUN_NUMBER}"

  # ---------------------------------------------------------------------------
  # Google Play, beside GitHub - not instead of it.
  #
  # The release on GitHub is made by the job above and nothing here touches it.
  # This one takes the same bundle that same build produced and hands it to
  # Google as well, so a new version lands in both places at once.
  #
  # Nothing here can hold up or redden the phone build: it waits for it, and
  # any trouble of its own is its own. With no PLAY_JSON in the secrets it does
  # nothing at all and the build ends exactly as it always did.
  # ---------------------------------------------------------------------------
  play:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      PLAY_JSON: ${{ secrets.PLAY_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the bundle the build made
        if: env.PLAY_JSON != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: KURDISTAN-IPTV-aab
          path: play

      # An unsigned build makes no bundle. That is not a fault - it just means
      # there is nothing to send, and everything else carries on.
      - name: Is there a bundle
        id: bundle
        if: env.PLAY_JSON != ''
        run: |
          AAB=$(ls play/*.aab 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "No bundle was built - nothing is sent to Google Play."
            echo "found=no" >> "$GITHUB_OUTPUT"
          else
            echo "bundle: $AAB"
            echo "found=yes" >> "$GITHUB_OUTPUT"
          fi

      # Play shows a short "what's new" per language, at most 500 characters.
      # WHATSNEW.md already holds one in three languages, marked [en] [ku] [ar];
      # the English one is taken from it, so the same words reach both places.
      # The file has to be named after the listing's language - en-US unless a
      # repository variable named PLAY_LANG says otherwise.
      - name: Take the release notes from WHATSNEW.md
        if: steps.bundle.outputs.found == 'yes'
        env:
          PLAY_LANG: ${{ vars.PLAY_LANG || 'en-US' }}
        run: |
          mkdir -p play/whatsnew
          python3 - <<'PY'
          import io, os, re
          text = ""
          if os.path.exists("WHATSNEW.md"):
              text = io.open("WHATSNEW.md", encoding="utf-8").read()
          m = re.search(r"\[en\]\s*(.*?)(?=\n\[(?:ku|ar)\]|\Z)", text, re.S)
          note = (m.group(1) if m else text).strip()
          if not note:
              note = "Bug fixes and improvements."
          if len(note) > 500:
              note = note[:497].rstrip() + "..."
          lang = os.environ.get("PLAY_LANG") or "en-US"
          io.open("play/whatsnew/whatsnew-" + lang, "w", encoding="utf-8").write(note)
          print(note)
          PY

      # The track decides where it lands. A brand new developer account can
      # only use the testing tracks until Google opens production to it, so
      # this starts on "internal" and is moved later by setting a repository
      # variable named PLAY_TRACK to "production" - no change to this file.
      - name: Send it to Google Play
        if: steps.bundle.outputs.found == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_JSON }}
          packageName: com.kurdistan.iptv
          releaseFiles: play/*.aab
          releaseName: 1.0 (${{ github.run_number }})
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: play/whatsnew

      - name: Say what happened
        if: env.PLAY_JSON == ''
        run: echo "No PLAY_JSON in the secrets - nothing was sent to Google Play."
