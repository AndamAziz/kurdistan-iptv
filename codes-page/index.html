<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KURDISTAN IPTV Codes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* A tool that lives beside the app it serves, so it wears the app's own
   night palette on purpose - one committed look, painted explicitly. */
:root{
  color-scheme: dark;
  --bg:#080B10; --bg2:#0D121A; --surface:#121926; --surface2:#182231;
  --line:#1E2734; --line2:#2A3648;
  --text:#EAF0F7; --muted:#8B97A6; --muted2:#5E6977;
  --accent:#E63E46; --accent2:#FF6A5E;
  --live:#3FBF7F; --soon:#E8A33D; --dead:#6B7787;
  --r:14px;
  direction: ltr;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14.5px; line-height:1.6; direction:ltr;
  padding-block:0; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Inter","Segoe UI",system-ui,sans-serif;margin:0;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;direction:ltr;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1020px;margin:0 auto;padding:0 16px}

/* ---------- the way in ---------- */
#gate{min-height:100svh;display:grid;place-items:center;padding:32px 16px}
#gate .box{width:100%;max-width:360px;text-align:center}
.mark{width:96px;height:80px;margin:0 auto 18px;filter:drop-shadow(0 8px 26px rgba(230,62,70,.28))}
#gate h1{font-size:19px;letter-spacing:.5px;font-weight:800}
#gate h1 em{font-style:normal;color:var(--accent2)}
#gate p{color:var(--muted);font-size:13px;margin:6px 0 22px}
.field{display:block;width:100%;padding:14px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);outline:none;text-align:center;letter-spacing:1px}
.field:focus{border-color:rgba(230,62,70,.55)}
.go{width:100%;margin-top:12px;padding:14px;border-radius:var(--r);font-weight:700;
  background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 12px 26px rgba(230,62,70,.28)}
.go:disabled{background:var(--surface2);color:var(--muted2);box-shadow:none;cursor:default}
.err{min-height:22px;padding-top:10px;color:#FF8A8A;font-size:12.5px;font-weight:600}

/* ---------- the tool ---------- */
#app{display:none}
#app.on{display:block}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,11,16,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.top .m{width:34px;height:28px;flex:none}
.top h2{font-size:15.5px;font-weight:800;flex:1;min-width:0}
.top h2 s{display:block;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted2);
  font-family:"Inter",sans-serif}
.ghost{padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--muted);
  font-size:12.5px;font-weight:700;background:var(--surface)}
.ghost:hover{background:var(--surface2);color:var(--text)}

section{padding-block:22px}
.lede{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.lede h3{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.lede span{font-size:12px;color:var(--muted2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.row2{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
@media (max-width:620px){.row2{grid-template-columns:1fr}}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted2);margin-bottom:7px}
.inp{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);
  outline:none}
.inp:focus{border-color:rgba(230,62,70,.5)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);
  color:var(--muted);font-size:12.5px;font-weight:700}
.chip[aria-pressed="true"]{border-color:transparent;color:#fff;
  background:linear-gradient(100deg,var(--accent),var(--accent2))}
.make{margin-top:16px;padding:13px 22px;border-radius:12px;font-weight:800;
  background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff}
.make:disabled{background:var(--surface2);color:var(--muted2);cursor:default}

/* the new code, the one thing on the page worth shouting about */
#made{margin-top:16px;display:none;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 18px;border-radius:16px;border:1px solid rgba(230,62,70,.45);
  background:linear-gradient(100deg,rgba(230,62,70,.14),rgba(255,106,94,.05))}
#made.on{display:flex}
#made b{font-size:34px;font-weight:700;letter-spacing:6px;flex:1;min-width:150px}
#made i{font-style:normal;font-size:12px;color:var(--muted);display:block;letter-spacing:0;
  font-family:"Inter",sans-serif}

/* ---------- the codes ---------- */
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.tools .inp{flex:1;min-width:170px;padding:10px 13px}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;display:grid;gap:10px;
  grid-template-columns:auto 1fr auto;align-items:center}
.card.dim{opacity:.55}
.card .code{font-size:19px;font-weight:700;letter-spacing:3px;cursor:pointer;border-bottom:1px dashed var(--line2)}
.card .who{min-width:0}
.card .who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .who s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted2);margin-top:2px}
.pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;white-space:nowrap}
.pill.live{background:rgba(63,191,127,.14);color:var(--live)}
.pill.soon{background:rgba(232,163,61,.15);color:var(--soon)}
.pill.dead{background:var(--surface2);color:var(--dead)}
.acts{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.acts button{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
  font-size:12px;font-weight:700;color:var(--muted)}
.acts button:hover{color:var(--text);background:var(--surface2)}
.acts .danger{color:#FF8A8A}
.acts .yes{color:#fff;background:rgba(230,62,70,.75);border-color:transparent}
.empty{text-align:center;color:var(--muted2);padding:40px 10px;font-size:13px}

.foot{border-top:1px solid var(--line);margin-top:26px}
.foot .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:18px;
  font-size:12px;color:var(--muted2)}
.foot .wrap span{flex:1;min-width:120px}

#toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;
  display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
#toast b{background:var(--surface2);border:1px solid var(--line2);padding:10px 18px;border-radius:999px;
  font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.55)}

/* ---------- v2 ---------- */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;padding-top:18px}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start;cursor:pointer}
.stat[aria-pressed="true"]{border-color:rgba(230,62,70,.6)}
.stat b{display:block;font-size:22px;font-weight:800;font-family:"Inter",sans-serif}
.stat s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);font-weight:700}
.stat.live b{color:var(--live)} .stat.soon b{color:var(--soon)} .stat.dead b{color:var(--dead)}
.sub{font-size:11.5px;font-weight:700;color:var(--muted2);margin:14px 0 0}
.share{display:flex;gap:7px;flex-wrap:wrap}
.share a,.share button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
  font-size:12.5px;font-weight:700;color:var(--text);text-decoration:none}
.share .wa{background:#1f7a4d;border-color:transparent}
.share .tg{background:#1f6fa8;border-color:transparent}
.sort{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--text)}
.tag{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;margin-inline-start:6px;vertical-align:middle}
.tag.rev{background:rgba(66,133,244,.18);color:#8AB4F8}
.tag.inf{background:rgba(63,191,127,.14);color:var(--live)}
.card.soon{border-color:rgba(232,163,61,.45)}
.act{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted2)}
.act b{color:var(--text);font-size:13.5px;font-weight:800;margin-right:3px}
.act .hot b{color:#4ADE80}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;padding:0 2px}
.spark i{display:block;width:7px;min-height:2px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.14)}
.spark i.on{background:linear-gradient(180deg,#FFB547,#F07A1C)}
.spark i.now{outline:1px solid rgba(255,255,255,.55);outline-offset:1px}
.acts .minus{color:#FFB547}
.acts .dt{padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;font-size:12.5px;color-scheme:dark}
.acts .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.devs{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:10px}
.devs .d{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.devs .d span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devs .d button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:#FF8A8A}
.confirm{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:#FF8A8A}
.confirm .inp{width:130px;padding:7px 10px;text-align:center}
</style>
</head>

<div id="toast"><b id="toastText"></b></div>
<script>
var API = "https://dbmxnhsnipbpycmdmmer.supabase.co/functions/v1/kiptv-admin";
var APP_LINK = "https://play.google.com/store/apps/details?id=com.kurdistan.iptv";
var PASS = "", ROWS = [], DAYS = 30, DEVN = 2, FILTER = "all";
var ASK = "", LIM = "", ADD = "", OPEN = "", DEVS = {}, LAST = { code: "", label: "", days: 30, n: 2 };
var IDLE_MS = 30 * 60 * 1000, IDLE_T = null;

/* ---------- small helpers ---------- */
function $(id){ return document.getElementById(id) }
/* the password stays only in this tab (sessionStorage) - never on the disk */
function store(k, v){ try{ v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v) }catch(e){} }
function stored(k){ try{ return sessionStorage.getItem(k) || "" }catch(e){ return "" } }
try{ localStorage.removeItem("kiptv_pw") }catch(e){}   /* the old page kept it on the disk */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c] }) }

var TOAST_T = null;
function toast(msg){
  $("toastText").textContent = msg;
  $("toast").classList.add("on");
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(function(){ $("toast").classList.remove("on") }, 2200);
}
function copy(text, what){
  var done = function(){ toast(what || ("Copied: " + text)) };
  try{ navigator.clipboard.writeText(text).then(done, function(){ select(text, what) }) }
  catch(e){ select(text, what) }
}
function select(text, what){
  var n = document.createElement("textarea");
  n.value = text; n.style.position = "fixed"; n.style.opacity = "0";
  document.body.appendChild(n); n.select();
  try{ document.execCommand("copy"); toast(what || ("Copied: " + text)) }
  catch(e){ toast("Could not copy") }
  document.body.removeChild(n);
}

function call(body){
  body.pass = PASS;
  return fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, reason:"net" } }) })
    .catch(function(){ return { ok: false, reason: "net" } })
    .then(function(r){ if(r && r.reason === "auth" && $("app").classList.contains("on")) lock("Please sign in again"); return r });
}
function why(r){
  var x = r && r.reason;
  return x === "auth"  ? "Wrong password"
       : x === "net"   ? "Could not connect. Check your internet"
       : x === "short" ? "The password must be at least 8 characters"
       : x === "full"  ? "Could not find a free code"
       : "Something went wrong, please try again";
}

/* ---------- dates, in the words the owner uses ---------- */
function num(n){ return String(n) }
function day(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d)) return "";
  var p = function(x){ return (x < 10 ? "0" : "") + x };
  return num(d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()));
}
function left(iso){ return iso ? Math.ceil((Date.parse(iso) - Date.now()) / 86400000) : null }
function seen(iso){
  if(!iso) return "never used";
  var h = Math.floor((Date.now() - Date.parse(iso)) / 3600000);
  if(h < 1) return "active now";
  if(h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  var dd = Math.floor(h / 24); return dd + (dd === 1 ? " day ago" : " days ago");
}
function unlimited(x){ return (x.max_devices || 2) >= 100 }
function review(x){ return /google|review/i.test(String(x.label || "")) }
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s") }
function durText(days){ return days ? (days % 365 === 0 ? plural(days / 365, "year") : days % 30 === 0 ? plural(days / 30, "month") : plural(days, "day")) : "Lifetime" }

/* the message that goes to the customer */
function message(code, days, until){
  return "KURDISTAN IPTV activation code: " + code + "\n"
       + (until ? "Valid until: " + day(until) : "Duration: " + durText(days)) + "\n"
       + "Get the app: " + APP_LINK;
}

/* ---------- the way in, and the way out ---------- */
function signIn(pass){
  PASS = pass;
  $("gerr").textContent = "";
  $("enter").disabled = true;
  $("enter").textContent = "Please wait…";
  return call({ do: "list" }).then(function(r){
    $("enter").disabled = false;
    $("enter").textContent = "Sign in";
    if(!r.ok){ PASS = ""; $("gerr").textContent = why(r); return false }
    store("kiptv_pw", pass);
    $("gate").style.display = "none";
    $("app").classList.add("on");
    put(r.rows || []);
    awake();
    return true;
  });
}
function lock(msg){
  store("kiptv_pw", null); PASS = "";
  clearTimeout(IDLE_T);
  $("app").classList.remove("on");
  $("gate").style.display = "grid";
  $("pw").value = ""; $("gerr").textContent = msg || ""; $("pw").focus();
}
function awake(){
  clearTimeout(IDLE_T);
  if(PASS) IDLE_T = setTimeout(function(){ lock("Locked after inactivity") }, IDLE_MS);
}
["click", "keydown", "touchstart"].forEach(function(ev){ document.addEventListener(ev, awake, { passive: true }) });
$("enter").addEventListener("click", function(){ if($("pw").value) signIn($("pw").value) });
$("pw").addEventListener("keydown", function(e){ if(e.key === "Enter" && $("pw").value) signIn($("pw").value) });
$("lock").addEventListener("click", function(){ lock() });

/* ---------- making a code ---------- */
function pick(group, attr, set){
  $(group).addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if(!b) return;
    set(+b.getAttribute(attr));
    [].forEach.call(this.querySelectorAll(".chip"), function(c){ c.setAttribute("aria-pressed", c === b ? "true" : "false") });
  });
}
pick("days", "data-d", function(v){ DAYS = v });
pick("devsel", "data-n", function(v){ DEVN = v });

$("make").addEventListener("click", function(){
  var label = $("label").value.trim();
  $("merr").textContent = "";
  $("make").disabled = true;
  $("make").textContent = "Please wait…";
  var days = DAYS, n = DEVN;
  /* the code and its machine limit are made together, in one step; the
     server says back which limit it saved, and only that counts as done */
  call({ do: "new", label: label, days: days, max: n }).then(function(r){
    if(!r.ok || !r.code || +r.max === n) return r;
    /* an older server ignores max: set it now, and say so if that fails */
    return call({ do: "limit", code: r.code, max: n }).then(function(x){
      return x && x.ok && +x.max === n ? r : { ok: false, reason: "limit", code: r.code };
    });
  }).then(function(r){
    $("make").disabled = false;
    $("make").textContent = "Create code";
    if(r.reason === "limit"){ $("merr").textContent = "The device limit was not saved — check the code in the list (" + r.code + ")"; load(); return }
    if(!r.ok || !r.code){ $("merr").textContent = why(r); return }
    LAST = { code: r.code, label: label, days: days, n: n };
    $("madeCode").textContent = r.code;
    $("madeWho").textContent = (label || "No name") + " · " + durText(days) + " · "
      + (n >= 100 ? "unlimited devices" : plural(n, "device"));
    var msg = encodeURIComponent(message(r.code, days));
    $("waMade").href = "https://wa.me/?text=" + msg;
    $("tgMade").href = "https://t.me/share/url?url=" + encodeURIComponent(APP_LINK) + "&text=" + msg;
    $("made").classList.add("on");
    $("label").value = "";
    copy(r.code);
    load();
  });
});
$("copyMade").addEventListener("click", function(){ copy(LAST.code) });
$("copyMsg").addEventListener("click", function(){ copy(message(LAST.code, LAST.days), "Message copied") });

/* ---------- the list ---------- */
function load(){
  return call({ do: "list" }).then(function(r){
    if(!r.ok){ toast(why(r)); return }
    put(r.rows || []);
  });
}
function state(x){
  if(!x.active) return "off";
  var d = left(x.expires_at);
  if(d !== null && d <= 0) return "over";
  if(d !== null && d <= 7) return "soon";
  return "live";
}
function today(x){ return x.today != null ? x.today > 0 : (x.last_seen && Date.now() - Date.parse(x.last_seen) < 86400000) }
function put(rows){
  ROWS = rows;
  var c = { live: 0, soon: 0, dead: 0, today: 0, devt: 0 };
  rows.forEach(function(x){
    var s = state(x);
    if(s === "live" || s === "soon") c.live++;
    if(s === "soon") c.soon++;
    if(s === "over" || s === "off") c.dead++;
    if(today(x)) c.today++;
    c.devt += +x.today || 0;
  });
  $("nAll").textContent = num(rows.length); $("nLive").textContent = num(c.live);
  $("nSoon").textContent = num(c.soon); $("nDead").textContent = num(c.dead); $("nToday").textContent = num(c.today); $("nDevT").textContent = num(c.devt);
  $("count").textContent = rows.length + " codes · " + c.live + " active";
  draw();
}
$("stats").addEventListener("click", function(e){
  var b = e.target.closest(".stat");
  if(!b) return;
  FILTER = b.getAttribute("data-f");
  [].forEach.call(this.querySelectorAll(".stat"), function(c){ c.setAttribute("aria-pressed", c === b ? "true" : "false") });
  draw();
});

function draw(){
  var q = $("q").value.trim().toLowerCase(), sort = $("sort").value;
  var rows = ROWS.filter(function(x){
    var s = state(x);
    if(FILTER === "live" && !(s === "live" || s === "soon")) return false;
    if(FILTER === "soon" && s !== "soon") return false;
    if(FILTER === "dead" && !(s === "over" || s === "off")) return false;
    if(FILTER === "today" && !today(x)) return false;
    return !q || x.code.indexOf(q) > -1 || String(x.label || "").toLowerCase().indexOf(q) > -1;
  });
  var t = function(v, far){ return v ? Date.parse(v) : far };
  if(sort === "end") rows.sort(function(a, b){ return t(a.expires_at, 9e15) - t(b.expires_at, 9e15) });
  else if(sort === "seen") rows.sort(function(a, b){ return t(b.last_seen, 0) - t(a.last_seen, 0) });
  else if(sort === "today") rows.sort(function(a, b){ return (b.today || 0) - (a.today || 0) || (b.week || 0) - (a.week || 0) });
  else if(sort === "week") rows.sort(function(a, b){ return (b.week || 0) - (a.week || 0) || (b.today || 0) - (a.today || 0) });
  else rows.sort(function(a, b){ return t(b.created_at, 0) - t(a.created_at, 0) });
  $("sum").textContent = rows.length === ROWS.length ? "" : rows.length + " of " + ROWS.length;
  if(!rows.length){
    $("list").innerHTML = '<div class="empty">' + (ROWS.length ? "Nothing found" : "No codes yet") + "</div>";
    return;
  }
  $("list").innerHTML = rows.map(card).join("");
}

/* the last 14 days as small bars: how many machines used the code each day */
function activity(x){
  var sp = x.spark || [], max = 0, i, h = "";
  for(i = 0; i < sp.length; i++) max = Math.max(max, +sp[i] || 0);
  for(i = 0; i < sp.length; i++){
    var v = +sp[i] || 0, d = new Date(Date.now() - (sp.length - 1 - i) * 86400000);
    h += '<i class="' + (v ? "on" : "") + (i === sp.length - 1 ? " now" : "") + '" style="height:' + (v ? 4 + Math.round(22 * v / max) : 2) + 'px"'
       + ' title="' + day(d.toISOString()) + ": " + plural(v, "device") + '"></i>';
  }
  return '<div class="act"><span class="spark" aria-label="Devices per day, last 14 days">' + h + "</span>"
    + '<span class="' + (x.today ? "hot" : "") + '"><b>' + (x.today || 0) + "</b>today</span>"
    + "<span><b>" + (x.week || 0) + "</b>this week</span>"
    + "<span><b>" + (x.devices || 0) + "</b>devices in all</span></div>";
}

function card(x){
  var s = state(x), d = left(x.expires_at), inf = unlimited(x), rev = review(x);
  var pill = s === "live" ? '<span class="pill live">Active</span>'
           : s === "soon" ? '<span class="pill soon">' + plural(d, "day") + " left</span>"
           : s === "over" ? '<span class="pill dead">Expired</span>'
           :                '<span class="pill dead">Off</span>';
  var when = x.expires_at ? (s === "over" ? "expired " : "until ") + day(x.expires_at) : "lifetime";
  var devs = inf ? "unlimited devices" : (x.devices || 0) + "/" + (x.max_devices || 2) + " devices";
  var h = '<article class="card' + (s === "soon" ? " soon" : s === "live" ? "" : " dim") + '">'
    + '<button class="code mono" data-copy="' + x.code + '" title="Copy">' + x.code + "</button>"
    + '<div class="who"><b>' + esc(x.label || "No name")
    +   (rev ? '<span class="tag rev">Google Review</span>' : "")
    +   (inf ? '<span class="tag inf">∞</span>' : "") + "</b>"
    +   "<s>" + when + " · " + devs + " · " + seen(x.last_seen) + "</s></div>"
    + pill + activity(x) + '<div class="acts">';
  if(ASK === x.code){
    h += rev
      ? '<div class="confirm">This is the Google review code. Type the code to delete it:'
        + '<input class="inp mono" id="askIn" inputmode="numeric" maxlength="6" placeholder="' + x.code + '">'
        + '<button class="yes" data-del="' + x.code + '" data-strict="1">Delete</button><button data-no="1">Cancel</button></div>'
      : '<button class="yes" data-del="' + x.code + '">Yes, delete</button><button data-no="1">Cancel</button>';
  } else {
    h += '<button data-addm="' + x.code + '">+ Time</button>';
    if(ADD === x.code){
      h += [30, 90, 180, 365].map(function(n){
        return '<button data-add="' + x.code + '" data-days="' + n + '">+ ' + durText(n) + "</button>" }).join("");
      h += '<span class="sep"></span>' + [7, 30].map(function(n){
        return '<button class="minus" data-add="' + x.code + '" data-days="-' + n + '">− ' + durText(n) + "</button>" }).join("");
      h += '<span class="sep"></span><input class="dt" type="date" id="dt' + x.code + '" value="' + day(x.expires_at) + '" aria-label="End date">'
         + '<button data-setd="' + x.code + '">Set date</button>'
         + '<button data-life="' + x.code + '">Lifetime</button>';
    }
    h += '<button data-flip="' + x.code + '" data-on="' + (x.active ? "0" : "1") + '">' + (x.active ? "Turn off" : "Turn on") + "</button>"
;
    if((x.devices || 0) > 0) h += '<button data-devs="' + x.code + '">Devices (' + x.devices + ")</button>";
    h += '<button data-share="' + x.code + '">Share</button>'
       + '<button class="danger" data-ask="' + x.code + '">Delete</button>';
  }
  h += "</div>";
  if(OPEN === x.code){
    var list = DEVS[x.code];
    h += '<div class="devs">' + (!list ? "…" : !list.length ? "No devices"
      : list.map(function(v){
          return '<div class="d"><span class="mono">' + esc(v.device) + "</span><i>" + seen(v.last_seen) + (v.checks ? " · " + plural(v.checks, "check") : "") + "</i>"
               + '<button data-forget="' + x.code + '" data-dev="' + esc(v.device) + '">Remove</button></div>' }).join("")
        + '<div class="d"><span></span><button data-reset="' + x.code + '">Remove all</button></div>')
      + "</div>";
  }
  return h + "</article>";
}

$("q").addEventListener("input", draw);
$("sort").addEventListener("change", draw);
$("reload").addEventListener("click", function(){ load().then(function(){ toast("Refreshed") }) });

function after(r, ok){ toast(r.ok ? ok : why(r)); return load() }
function openDevs(code){
  OPEN = code; DEVS[code] = null; draw();
  call({ do: "devices", code: code }).then(function(r){
    DEVS[code] = r.ok ? (r.devices || []) : [];
    if(!r.ok) toast(why(r));
    draw();
  });
}

$("list").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;
  var v, row = function(c){ return ROWS.filter(function(x){ return x.code === c })[0] };
  if((v = b.getAttribute("data-copy"))){ copy(v); return }
  if((v = b.getAttribute("data-ask"))){ ASK = v; draw(); var i = $("askIn"); if(i) i.focus(); return }
  if(b.getAttribute("data-no")){ ASK = ""; draw(); return }
  if((v = b.getAttribute("data-del"))){
    if(b.getAttribute("data-strict") && ($("askIn") || {}).value !== v){ toast("Type the code exactly"); return }
    ASK = "";
    call({ do: "delete", code: v }).then(function(r){ after(r, "Deleted") });
    return;
  }
  if((v = b.getAttribute("data-addm"))){ ADD = (ADD === v ? "" : v); LIM = ""; draw(); return }
  if((v = b.getAttribute("data-add"))){
    var n = +b.getAttribute("data-days"); ADD = "";
    call({ do: "extend", code: v, days: n }).then(function(r){ after(r, n > 0 ? durText(n) + " added" : durText(-n) + " taken off") });
    return;
  }
  if((v = b.getAttribute("data-setd"))){
    var dv = ($("dt" + v) || {}).value || "";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)){ toast("Choose a date first"); return }
    ADD = "";
    call({ do: "setdate", code: v, until: dv }).then(function(r){ after(r, "Ends on " + dv) });
    return;
  }
  if((v = b.getAttribute("data-life"))){
    ADD = "";
    call({ do: "setdate", code: v, until: null }).then(function(r){ after(r, "Lifetime — no end date") });
    return;
  }
  if((v = b.getAttribute("data-lim"))){ LIM = (LIM === v ? "" : v); ADD = ""; draw(); return }
  if((v = b.getAttribute("data-setlim"))){
    LIM = "";
    call({ do: "limit", code: v, max: +b.getAttribute("data-n") }).then(function(r){ after(r, "Limit changed") });
    return;
  }
  if((v = b.getAttribute("data-devs"))){ if(OPEN === v){ OPEN = ""; draw() } else openDevs(v); return }
  if((v = b.getAttribute("data-forget"))){
    var dev = b.getAttribute("data-dev");
    call({ do: "forget", code: v, device: dev }).then(function(r){
      toast(r.ok ? "Device removed" : why(r)); load().then(function(){ openDevs(v) });
    });
    return;
  }
  if((v = b.getAttribute("data-reset"))){
    call({ do: "reset", code: v }).then(function(r){ OPEN = ""; after(r, "All devices removed") });
    return;
  }
  if((v = b.getAttribute("data-share"))){
    var x = row(v) || {};
    copy(message(v, 0, x.expires_at), "Message copied — paste it in WhatsApp or Telegram");
    return;
  }
  if((v = b.getAttribute("data-flip"))){
    call({ do: "toggle", code: v, active: b.getAttribute("data-on") === "1" }).then(function(r){ after(r, "Updated") });
  }
});

/* ---------- the owner's own password ---------- */
$("chpw").addEventListener("click", function(){
  var box = $("chpw").parentNode;
  if(box.querySelector(".pwbox")) return;
  var d = document.createElement("div");
  d.className = "pwbox";
  d.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:10px";
  d.innerHTML = '<input class="inp" id="npw" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" style="flex:1;min-width:190px">'
              + '<input class="inp" id="npw2" type="password" autocomplete="new-password" placeholder="Repeat" style="flex:1;min-width:150px">'
              + '<button class="ghost" id="npwGo">Save</button>';
  box.appendChild(d);
  $("npw").focus();
  $("npwGo").addEventListener("click", function(){
    var v = $("npw").value;
    if(v.length < 8){ toast("At least 8 characters"); return }
    if(v !== $("npw2").value){ toast("The two passwords do not match"); return }
    call({ do: "pass", next: v }).then(function(r){
      if(!r.ok){ toast(why(r)); return }
      PASS = v; store("kiptv_pw", v);
      d.remove();
      toast("Password changed");
    });
  });
});

/* ---------- start ---------- */
(function start(){
  document.documentElement.dir = "ltr";
  var saved = stored("kiptv_pw");
  if(saved) signIn(saved).then(function(good){ if(!good) $("pw").focus() });
  else $("pw").focus();
})();
</script>
